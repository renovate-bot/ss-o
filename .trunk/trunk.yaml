version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: configs
      ref: v1.2.1
      uri: https://github.com/trunk-io/configs
      import_to_global: true
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
      import_to_global: true
lint:
  disabled:
    - markdown-table-prettify
    - checkov
    - yamllint
    - renovate
    - remark-lint
    - codespell
    - semgrep
    - cspell
    - gofmt
    - golangci-lint
    - gokart
    - trivy
    - trufflehog
  enabled:
    - pre-commit-hooks@4.6.0
    - markdownlint@0.49.1
    - actionlint@1.7.12
    - git-diff-check
    - gitleaks@8.30.1
    - svgo@4.1.0
    - prettier@3.9.6
  ignore:
    - linters: [svgo]
      paths:
        - metrics/**

runtimes:
  enabled:
    - python@3.14.4
    - go@1.21.0
    - node@22.16.0
actions:
  disabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - commitlint
    - commitizen
  enabled:
    - git-blame-ignore-revs
    - trunk-announce
    - trunk-upgrade-available
